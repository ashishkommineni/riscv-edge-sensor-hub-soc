<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RISC-V Reliable Edge Sensor Hub architecture</title>
  <desc id="desc">SPI sensor traffic crosses an asynchronous FIFO, is moved by DMA into SECDED SRAM, processed by an INT8 accelerator, and supervised by a RISC-V CPU, interrupts, and UART.</desc>
  <defs>
    <style>
      .bg{fill:#0b1220}.block{fill:#16243a;stroke:#52c7ea;stroke-width:2}.safe{fill:#14382f;stroke:#55d69e;stroke-width:2}.ctrl{fill:#30204a;stroke:#bd8cff;stroke-width:2}.text{fill:#f4f7fb;font:600 17px system-ui,sans-serif}.small{fill:#b8c5d6;font:14px system-ui,sans-serif}.arrow{stroke:#d4e2f2;stroke-width:3;fill:none;marker-end:url(#a)}.cdc{stroke:#ffca62;stroke-width:3;stroke-dasharray:8 6}.domain{fill:none;stroke:#56677c;stroke-width:2;stroke-dasharray:6 6}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#d4e2f2"/></marker>
  </defs>
  <rect class="bg" width="1200" height="650" rx="20"/>
  <text x="45" y="48" class="text" font-size="25">RISC-V Reliable Edge Sensor Hub SoC</text>
  <rect x="35" y="75" width="280" height="500" rx="18" class="domain"/>
  <text x="55" y="105" class="small">SPI CLOCK DOMAIN</text>
  <rect x="70" y="155" width="205" height="80" rx="12" class="block"/>
  <text x="172" y="188" text-anchor="middle" class="text">SPI Mode-0 RX</text>
  <text x="172" y="214" text-anchor="middle" class="small">MSB-first bytes</text>
  <rect x="70" y="315" width="205" height="100" rx="12" class="safe"/>
  <text x="172" y="352" text-anchor="middle" class="text">Async FIFO</text>
  <text x="172" y="378" text-anchor="middle" class="small">Gray pointers · 16 bytes</text>
  <path d="M172 235 L172 315" class="arrow"/>
  <line x1="315" y1="75" x2="315" y2="575" class="cdc"/>
  <text x="325" y="100" class="small" fill="#ffca62">CDC boundary</text>

  <rect x="370" y="75" width="790" height="500" rx="18" class="domain"/>
  <text x="390" y="105" class="small">SYSTEM CLOCK DOMAIN</text>
  <rect x="400" y="140" width="210" height="90" rx="12" class="ctrl"/>
  <text x="505" y="176" text-anchor="middle" class="text">RV32I Control Core</text>
  <text x="505" y="202" text-anchor="middle" class="small">boot firmware · polling</text>
  <rect x="690" y="140" width="190" height="90" rx="12" class="block"/>
  <text x="785" y="176" text-anchor="middle" class="text">MMIO Fabric</text>
  <text x="785" y="202" text-anchor="middle" class="small">decode + error response</text>
  <path d="M610 185 L690 185" class="arrow"/>

  <rect x="400" y="315" width="170" height="90" rx="12" class="block"/>
  <text x="485" y="350" text-anchor="middle" class="text">Sensor DMA</text>
  <text x="485" y="376" text-anchor="middle" class="small">one pop outstanding</text>
  <path d="M275 365 L400 365" class="arrow"/>
  <path d="M745 230 L540 315" class="arrow"/>

  <rect x="650" y="300" width="205" height="120" rx="12" class="safe"/>
  <text x="752" y="340" text-anchor="middle" class="text">SECDED SRAM</text>
  <text x="752" y="366" text-anchor="middle" class="small">256 × 32 data bits</text>
  <text x="752" y="392" text-anchor="middle" class="small">fault injection + reports</text>
  <path d="M570 360 L650 360" class="arrow"/>

  <rect x="930" y="300" width="190" height="105" rx="12" class="block"/>
  <text x="1025" y="340" text-anchor="middle" class="text">INT8 Dot Product</text>
  <text x="1025" y="367" text-anchor="middle" class="small">signed result = −10</text>
  <path d="M855 350 L930 350" class="arrow"/>

  <rect x="650" y="470" width="205" height="70" rx="12" class="ctrl"/>
  <text x="752" y="500" text-anchor="middle" class="text">Interrupt Controller</text>
  <text x="752" y="524" text-anchor="middle" class="small">sticky + maskable</text>
  <rect x="930" y="470" width="190" height="70" rx="12" class="ctrl"/>
  <text x="1025" y="500" text-anchor="middle" class="text">UART TX</text>
  <text x="1025" y="524" text-anchor="middle" class="small">8-N-1 · “PASS”</text>
  <path d="M790 230 L790 470" class="arrow"/>
  <path d="M835 230 L1010 470" class="arrow"/>
  <path d="M930 385 L840 470" class="arrow"/>
  <text x="45" y="620" class="small">Dashed gold line marks the asynchronous boundary; reset deassertion is synchronized independently on both sides.</text>
</svg>
